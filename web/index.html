<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0">
  <title>Miru</title>
  <link rel="icon" type="image/svg+xml" href="miru-icon.svg">
  <style>
    :root { --bg: #f5f6f8; --text: #5b6170; --track: #e3e5e9; --bar: #4262ff;
            --top: #9a9a9a; --bottom: #2c2c2c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15171c; --text: #a4aab6; --track: #2a2e37; --bar: #6f88ff;
              --top: #f2f3f5; --bottom: #9ba1ad; }
    }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); }
    #screen { width: 100%; height: 100%; display: none; }

    #loader { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg);
              font: 14px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--text);
              transition: opacity 280ms ease-out; }
    #loader.done { opacity: 0; pointer-events: none; }
    .box { display: grid; justify-items: center; gap: 18px; }
    .mark { width: 120px; height: 120px; }
    .name { font-size: 26px; font-weight: 700; letter-spacing: -0.4px; color: var(--bottom); margin-top: -8px; display: flex; }
    .name span { opacity: 0; transform: translateY(8px); animation: rise 420ms cubic-bezier(.2,.8,.2,1) forwards; }
    .name span:nth-child(1) { animation-delay: 1000ms; }
    .name span:nth-child(2) { animation-delay: 1070ms; }
    .name span:nth-child(3) { animation-delay: 1140ms; }
    .name span:nth-child(4) { animation-delay: 1210ms; }
    .track { opacity: 0; animation: fadein 300ms ease-out 1300ms forwards; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes fadein { to { opacity: 1; } }
    .track { width: 140px; height: 3px; border-radius: 3px; background: var(--track); overflow: hidden; }
    .track i { display: block; width: 40%; height: 100%; border-radius: 3px; background: var(--bar);
               animation: slide 1.1s ease-in-out infinite; }
    #status { min-height: 1.4em; }
    .copy { font-size: 11px; opacity: .7; }

    /* The ground line draws itself, then the stem grows out of the root and sways. */
    .ground { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 900ms ease-out forwards; }
    .stem { transform-origin: 44px 84px; transform: scaleY(0); animation: grow 700ms cubic-bezier(.2,.8,.2,1) 500ms forwards,
            sway 2.4s ease-in-out 1.3s infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes grow { to { transform: scaleY(1); } }
    @keyframes sway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(2.5deg); } }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) {
      .ground { animation: none; stroke-dashoffset: 0; }
      .stem { animation: none; transform: none; }
      .track i { animation: none; width: 100%; opacity: .5; }
      .name span, .track { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite">
    <div class="box">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="93">
            <stop offset="0" style="stop-color: var(--top)"/>
            <stop offset="1" style="stop-color: var(--bottom)"/>
          </linearGradient>
        </defs>
        <path class="ground" fill="none" stroke="url(#lg)" stroke-width="3.8" stroke-linecap="round"
              d="M1.7 57.1 C17.3 56.4 25.9 46.7 32.1 48.8 C38.3 50.9 36.2 59.9 33.5 66.1 C28.7 77.1 32.1 90.9 42.4 90.9 C54.2 90.9 59 78.8 57.6 68.5 C56.6 59.9 56.2 50.9 62.1 48.8 C69 46.7 81.1 56.4 98.3 57.4"/>
        <path class="stem" fill="url(#lg)"
              d="M44.2 8 C46.5 24 51.5 44 52.4 62 C53.3 77 49.5 86.4 43.6 86.4 C38.6 86.4 36.6 81.6 37.6 76.6 C38.8 70.6 44.2 66.4 45.4 56 C46.3 44 45.6 24 44.2 8 Z"/>
      </svg>
      <div class="name" aria-label="Miru"><span>M</span><span>i</span><span>r</span><span>u</span></div>
      <div class="track"><i></i></div>
      <div id="status">Loading…</div>
      <div class="copy">© miru.com</div>
      <noscript>Miru needs JavaScript. Please enable it and reload.</noscript>
    </div>
  </div>
  <div id="screen"></div>

  <script>
    // Board storage for the web version (called from C++, src/app/WebStorage.cpp).
    // Every board autosaves into this browser (IndexedDB). On browsers with the File
    // System Access API (Chrome, Edge) "Save" links the board to a real file, and
    // autosave keeps writing that file. Results go back through cb(id, value).
    window.miruWeb = (() => {
      let dbp = null;
      const db = () => dbp || (dbp = new Promise((ok, fail) => {
        const r = indexedDB.open('miru', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('boards', { keyPath: 'uid' });
        r.onsuccess = () => ok(r.result);
        r.onerror = () => fail(r.error);
      }));
      const tx = async (mode, fn) => {
        const d = await db();
        return new Promise((ok, fail) => {
          const t = d.transaction('boards', mode);
          const res = fn(t.objectStore('boards'));
          t.oncomplete = () => ok(res && 'result' in res ? res.result : undefined);
          t.onerror = () => fail(t.error);
        });
      };
      const get = (uid) => tx('readonly', (s) => s.get(uid));
      const put = (rec) => tx('readwrite', (s) => s.put(rec));
      let pendingHandle = null;                 // file just opened, linked once its board id is known
      const types = [{ description: 'Miru board', accept: { 'application/octet-stream': ['.board'] } }];
      async function writeHandle(h, bytes, ask) {
        const opts = { mode: 'readwrite' };
        let p = await h.queryPermission(opts);
        if (p !== 'granted' && ask) p = await h.requestPermission(opts);
        if (p !== 'granted') return false;
        const w = await h.createWritable({ keepExistingData: false });
        try {
          await w.write(bytes);
          await w.close();             // the file only changes on close
        } catch (e) {
          try { await w.abort(); } catch (_) {}
          throw e;
        }
        const size = (await h.getFile()).size;
        if (size !== bytes.length) throw new Error(`the file has ${size} bytes instead of ${bytes.length}`);
        return true;
      }
      const safe = (cb, id, fn) => fn().then((v) => cb(id, v), (e) => { console.warn('miruWeb', e); cb(id, null); });
      return {
        canPickFile: 'showSaveFilePicker' in window,
        // Autosave: browser copy always; the linked file too if the browser still allows it.
        // -> 'file' | 'browser' | 'permission' (linked file needs a click on Save)
        save(id, uid, title, view, cb) {
          const bytes = view.slice();
          safe(cb, id, async () => {
            const old = await get(uid);
            const rec = { uid, title, data: bytes, time: Date.now(), handle: old ? old.handle : undefined };
            await put(rec);
            if (!rec.handle) return 'browser';
            try { return (await writeHandle(rec.handle, bytes, false)) ? 'file' : 'permission'; }
            catch (e) { console.warn('miruWeb file write', e); return '!' + (e && e.message || e); }
          });
        },
        // Save button (user click): write the linked file (asking permission again after a
        // reload) or pick a new one. -> file name, '' when cancelled, null when unsupported,
        // '!reason' when writing the file failed
        saveToFile(id, uid, title, suggested, view, asNew, cb) {
          const bytes = view.slice();
          safe(cb, id, async () => {
            if (!('showSaveFilePicker' in window)) return null;
            const old = await get(uid);
            let h = !asNew && old ? old.handle : undefined;
            if (!h) {
              try { h = await showSaveFilePicker({ suggestedName: suggested, types }); }
              catch (e) { return ''; }        // cancelled
            }
            try {
              if (!(await writeHandle(h, bytes, true))) return '!the browser did not allow writing the file';
            } catch (e) {
              return '!' + (e && e.message || e);
            }
            await put({ uid, title, data: bytes, time: Date.now(), handle: h });
            return h.name;
          });
        },
        // Open button: pick a .board file and remember it, so autosave writes back to it.
        // -> {name, bytes} | '' (cancelled) | null (unsupported)
        openFile(id, cb) {
          safe(cb, id, async () => {
            if (!('showOpenFilePicker' in window)) return null;
            let h;
            try { [h] = await showOpenFilePicker({ types }); } catch (e) { return ''; }
            pendingHandle = h;
            const f = await h.getFile();
            return { name: f.name, bytes: new Uint8Array(await f.arrayBuffer()) };
          });
        },
        linkOpened(uid, title) {
          const h = pendingHandle;
          pendingHandle = null;
          if (h) get(uid).then((old) => put({ uid, title, data: old ? old.data : new Uint8Array(), time: Date.now(), handle: h }));
        },
        load(id, uid, cb) { safe(cb, id, async () => { const r = await get(uid); return r ? r.data : null; }); },
        remove(uid) { tx('readwrite', (s) => s.delete(uid)).catch(() => {}); },
      };
    })();
  </script>
  <script src="Miru.js"></script>
  <script src="qtloader.js"></script>
  <script>
    (async () => {
      const loader = document.getElementById('loader');
      const screen = document.getElementById('screen');
      const status = document.getElementById('status');
      try {
        await qtLoad({
          qt: {
            entryFunction: window.Miru_entry,
            containerElements: [screen],
            onLoaded: () => {
              screen.style.display = 'block';
              loader.classList.add('done');
              setTimeout(() => loader.remove(), 320);
            },
            onExit: (exit) => {
              status.textContent = 'Miru stopped' + (exit.text ? ': ' + exit.text : '') + '. Reload the page to start again.';
              loader.classList.remove('done');
            },
          },
        });
      } catch (e) {
        console.error(e);
        status.textContent = 'Miru could not start in this browser. Try a recent Chrome, Edge, Firefox or Safari.';
      }
    })();
  </script>
</body>
</html>
