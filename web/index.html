<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, user-scalable=0">
  <title>Miru</title>
  <link rel="icon" type="image/svg+xml" href="miru-icon.svg">
  <style>
    :root { --bg: #f5f6f8; --text: #5b6170; --track: #e3e5e9; --bar: #4262ff;
            --top: #9a9a9a; --bottom: #2c2c2c; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #15171c; --text: #a4aab6; --track: #2a2e37; --bar: #6f88ff;
              --top: #f2f3f5; --bottom: #9ba1ad; }
    }
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: var(--bg); }
    #screen { width: 100%; height: 100%; display: none; }

    #loader { position: fixed; inset: 0; display: grid; place-items: center; background: var(--bg);
              font: 14px/1.4 "Segoe UI", system-ui, -apple-system, Roboto, sans-serif; color: var(--text);
              transition: opacity 280ms ease-out; }
    #loader.done { opacity: 0; pointer-events: none; }
    .box { display: grid; justify-items: center; gap: 18px; }
    .mark { width: 120px; height: 120px; }
    .name { font-size: 26px; font-weight: 700; letter-spacing: -0.4px; color: var(--bottom); margin-top: -8px; display: flex; }
    .name span { opacity: 0; transform: translateY(8px); animation: rise 420ms cubic-bezier(.2,.8,.2,1) forwards; }
    .name span:nth-child(1) { animation-delay: 1000ms; }
    .name span:nth-child(2) { animation-delay: 1070ms; }
    .name span:nth-child(3) { animation-delay: 1140ms; }
    .name span:nth-child(4) { animation-delay: 1210ms; }
    .track { opacity: 0; animation: fadein 300ms ease-out 1300ms forwards; }
    @keyframes rise { to { opacity: 1; transform: none; } }
    @keyframes fadein { to { opacity: 1; } }
    .track { width: 140px; height: 3px; border-radius: 3px; background: var(--track); overflow: hidden; }
    .track i { display: block; width: 40%; height: 100%; border-radius: 3px; background: var(--bar);
               animation: slide 1.1s ease-in-out infinite; }
    #status { min-height: 1.4em; }

    /* The ground line draws itself, then the stem grows out of the root and sways. */
    .ground { stroke-dasharray: 260; stroke-dashoffset: 260; animation: draw 900ms ease-out forwards; }
    .stem { transform-origin: 44px 84px; transform: scaleY(0); animation: grow 700ms cubic-bezier(.2,.8,.2,1) 500ms forwards,
            sway 2.4s ease-in-out 1.3s infinite; }
    @keyframes draw { to { stroke-dashoffset: 0; } }
    @keyframes grow { to { transform: scaleY(1); } }
    @keyframes sway { 0%, 100% { transform: rotate(0deg); } 50% { transform: rotate(2.5deg); } }
    @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) {
      .ground { animation: none; stroke-dashoffset: 0; }
      .stem { animation: none; transform: none; }
      .track i { animation: none; width: 100%; opacity: .5; }
      .name span, .track { animation: none; opacity: 1; transform: none; }
    }
  </style>
</head>
<body>
  <div id="loader" role="status" aria-live="polite">
    <div class="box">
      <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <linearGradient id="lg" gradientUnits="userSpaceOnUse" x1="0" y1="8" x2="0" y2="93">
            <stop offset="0" style="stop-color: var(--top)"/>
            <stop offset="1" style="stop-color: var(--bottom)"/>
          </linearGradient>
        </defs>
        <path class="ground" fill="none" stroke="url(#lg)" stroke-width="3.8" stroke-linecap="round"
              d="M1.7 57.1 C17.3 56.4 25.9 46.7 32.1 48.8 C38.3 50.9 36.2 59.9 33.5 66.1 C28.7 77.1 32.1 90.9 42.4 90.9 C54.2 90.9 59 78.8 57.6 68.5 C56.6 59.9 56.2 50.9 62.1 48.8 C69 46.7 81.1 56.4 98.3 57.4"/>
        <path class="stem" fill="url(#lg)"
              d="M44.2 8 C46.5 24 51.5 44 52.4 62 C53.3 77 49.5 86.4 43.6 86.4 C38.6 86.4 36.6 81.6 37.6 76.6 C38.8 70.6 44.2 66.4 45.4 56 C46.3 44 45.6 24 44.2 8 Z"/>
      </svg>
      <div class="name" aria-label="Miru"><span>M</span><span>i</span><span>r</span><span>u</span></div>
      <div class="track"><i></i></div>
      <div id="status">Loading…</div>
      <noscript>Miru needs JavaScript. Please enable it and reload.</noscript>
    </div>
  </div>
  <div id="screen"></div>

  <script src="Miru.js"></script>
  <script src="qtloader.js"></script>
  <script>
    (async () => {
      const loader = document.getElementById('loader');
      const screen = document.getElementById('screen');
      const status = document.getElementById('status');
      try {
        await qtLoad({
          qt: {
            entryFunction: window.Miru_entry,
            containerElements: [screen],
            onLoaded: () => {
              screen.style.display = 'block';
              loader.classList.add('done');
              setTimeout(() => loader.remove(), 320);
            },
            onExit: (exit) => {
              status.textContent = 'Miru stopped' + (exit.text ? ': ' + exit.text : '') + '. Reload the page to start again.';
              loader.classList.remove('done');
            },
          },
        });
      } catch (e) {
        console.error(e);
        status.textContent = 'Miru could not start in this browser. Try a recent Chrome, Edge, Firefox or Safari.';
      }
    })();
  </script>
</body>
</html>
