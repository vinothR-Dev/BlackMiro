# Every push to main: build Windows, web and Android, run the tests, then
#  - publish the files on the Releases page (tag v<version from CMakeLists.txt>;
#    pushing again with the same version replaces that release's files), and
#  - publish the web app on GitHub Pages.
# One-time setup: repo Settings -> Pages -> Source: "GitHub Actions".
name: Build and release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write      # create the release
  pages: write         # deploy GitHub Pages
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  QT_VERSION: 6.8.3
  EMSDK_VERSION: 3.1.56
  NDK_VERSION: 26.1.10909125

jobs:
  build:
    runs-on: windows-2022
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Read version from CMakeLists.txt
        id: ver
        shell: pwsh
        run: |
          $m = Select-String -Path CMakeLists.txt -Pattern 'project\(BlackMiro VERSION ([0-9.]+)'
          $v = $m.Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
          "Version $v"

      - name: Install Ninja
        run: choco install ninja -y --no-progress

      # Qt goes to C:\Qt\<version>\<kit>, where the build scripts look by default.
      - name: Qt for Windows
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: qtwebsockets qtimageformats qtpdf
          dir: 'C:\'
          set-env: false
          cache: true
      - name: Qt for WebAssembly
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: wasm
          arch: wasm_singlethread
          modules: qtwebsockets qtimageformats
          dir: 'C:\'
          set-env: false
          cache: true
      - name: Qt for Android
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: all_os
          target: android
          arch: android_arm64_v8a
          modules: qtwebsockets qtimageformats
          dir: 'C:\'
          set-env: false
          cache: true

      - name: Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}

      # sdkmanager and Gradle need Java 17; the runner's default JAVA_HOME is Java 8.
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK packages
        shell: pwsh
        run: |
          $sdk = $env:ANDROID_SDK_ROOT
          $mgr = Get-Item "$sdk\cmdline-tools\latest\bin\sdkmanager.bat" -ErrorAction SilentlyContinue
          if (-not $mgr) { $mgr = Get-ChildItem "$sdk\cmdline-tools" -Recurse -Filter sdkmanager.bat | Select-Object -First 1 }
          "y`n" * 20 | & $mgr.FullName "ndk;$env:NDK_VERSION" "platforms;android-36" "build-tools;36.0.0" | Out-Null
          "ANDROID_NDK_ROOT=$sdk\ndk\$env:NDK_VERSION" >> $env:GITHUB_ENV

      - name: Build Windows
        shell: cmd
        env:
          VSDIR: C:\Program Files\Microsoft Visual Studio\2022\Enterprise
        run: scripts\build-windows.bat

      - name: Run tests
        shell: cmd
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set PATH=C:\Qt\%QT_VERSION%\msvc2022_64\bin;%PATH%
          build\windows\tst_export.exe

      - name: Build web
        shell: cmd
        run: scripts\build-web.bat

      - name: Build Android
        shell: cmd
        run: scripts\build-android.bat

      - name: Installer tools (Inno Setup, WiX)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          dotnet tool install --global wix --version 6.0.0
          "$env:USERPROFILE\.dotnet\tools" >> $env:GITHUB_PATH

      - name: Package
        shell: cmd
        run: scripts\package-release.bat ${{ steps.ver.outputs.version }}

      # Every file goes through a real launch before anything is published.
      - name: Smoke test - portable zip
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $dir = "$env:RUNNER_TEMP\portable"
          Expand-Archive "dist\BlackMiro-$v\BlackMiro-$v-windows-portable.zip" $dir -Force
          ./scripts/smoke-test-windows.ps1 -Exe "$dir\BlackMiro-$v-windows-portable\BlackMiro.exe" -Name portable -OutDir smoke

      - name: Smoke test - MSI installer
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $msi = (Resolve-Path "dist\BlackMiro-$v\BlackMiro-$v-windows.msi").Path
          $p = Start-Process msiexec -ArgumentList '/i', "`"$msi`"", '/qn', '/l*v', "`"$env:RUNNER_TEMP\msi.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\msi.log" -Tail 60; throw "MSI install failed: $($p.ExitCode)" }
          ./scripts/smoke-test-windows.ps1 -Exe "$env:ProgramFiles\BlackMiro\BlackMiro.exe" -Name msi -OutDir smoke
          if (-not (Test-Path "$env:ProgramData\Microsoft\Windows\Start Menu\Programs\BlackMiro.lnk")) { throw "MSI: Start menu shortcut missing" }
          $p = Start-Process msiexec -ArgumentList '/x', "`"$msi`"", '/qn' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "MSI uninstall failed: $($p.ExitCode)" }

      - name: Smoke test - setup.exe installer
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $dir = "$env:RUNNER_TEMP\BlackMiroSetup"
          $p = Start-Process "dist\BlackMiro-$v\BlackMiro-$v-windows-setup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=`"$dir`"", "/LOG=`"$env:RUNNER_TEMP\setup.log`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log" -Tail 60; throw "Setup failed: $($p.ExitCode)" }
          ./scripts/smoke-test-windows.ps1 -Exe "$dir\BlackMiro.exe" -Name setup -OutDir smoke
          $p = Start-Process "$dir\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Uninstall failed: $($p.ExitCode)" }

      - name: Smoke test - web app
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $web = "$env:RUNNER_TEMP\web"
          Expand-Archive "dist\BlackMiro-$v\BlackMiro-$v-web.zip" $web -Force
          $srv = Start-Process python -ArgumentList '-m', 'http.server', '8765', '--directory', $web -PassThru
          New-Item -ItemType Directory "$env:RUNNER_TEMP\pw" -Force | Out-Null
          Copy-Item scripts\smoke-test-web.mjs "$env:RUNNER_TEMP\pw\"
          Push-Location "$env:RUNNER_TEMP\pw"
          npm init -y | Out-Null
          npm install playwright@1.49.1 --no-audit --no-fund | Out-Null
          npx playwright install chromium | Out-Null
          node smoke-test-web.mjs http://localhost:8765/index.html "$env:GITHUB_WORKSPACE\smoke\web.png"
          $code = $LASTEXITCODE
          Pop-Location
          Stop-Process $srv -Force
          exit $code

      - name: Upload smoke-test screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-tests
          path: smoke
          if-no-files-found: ignore

      - name: Release files
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: BlackMiro ${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            **Windows installer:** `BlackMiro-${{ steps.ver.outputs.version }}-windows-setup.exe` (recommended) or `BlackMiro-${{ steps.ver.outputs.version }}-windows.msi` (for IT / Group Policy deployment).
            **Windows portable (no install):** download `BlackMiro-${{ steps.ver.outputs.version }}-windows-portable.zip`, unzip anywhere, double-click `BlackMiro.exe`.
            **Android:** install `BlackMiro-${{ steps.ver.outputs.version }}-android-arm64.apk` (allow installing unknown apps).
            **Web:** open the app on this repository's GitHub Pages site, or host `BlackMiro-${{ steps.ver.outputs.version }}-web.zip` yourself.

            Built from ${{ github.sha }}.
          files: |
            dist/BlackMiro-${{ steps.ver.outputs.version }}/BlackMiro-${{ steps.ver.outputs.version }}-windows-setup.exe
            dist/BlackMiro-${{ steps.ver.outputs.version }}/BlackMiro-${{ steps.ver.outputs.version }}-windows.msi
            dist/BlackMiro-${{ steps.ver.outputs.version }}/BlackMiro-${{ steps.ver.outputs.version }}-windows-portable.zip
            dist/BlackMiro-${{ steps.ver.outputs.version }}/BlackMiro-${{ steps.ver.outputs.version }}-android-arm64.apk
            dist/BlackMiro-${{ steps.ver.outputs.version }}/BlackMiro-${{ steps.ver.outputs.version }}-web.zip

      - name: Prepare Pages site
        shell: pwsh
        # Landing page (site/index.html, versions and repo filled in) at the root,
        # the web app itself under /app/.
        run: |
          New-Item -ItemType Directory pages\app -Force | Out-Null
          $html = Get-Content site\index.html -Raw
          $html = $html.Replace('{{VERSION}}', '${{ steps.ver.outputs.version }}').Replace('{{REPO}}', '${{ github.repository }}')
          Set-Content pages\index.html $html -Encoding utf8
          foreach ($f in 'BlackMiro.html','BlackMiro.js','BlackMiro.wasm','qtloader.js','qtlogo.svg') {
            if (Test-Path "build\web\$f") { Copy-Item "build\web\$f" pages\app\ }
          }
          Copy-Item pages\app\BlackMiro.html pages\app\index.html
          New-Item pages\.nojekyll -ItemType File | Out-Null
      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: pages
          include-hidden-files: true

  pages:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
